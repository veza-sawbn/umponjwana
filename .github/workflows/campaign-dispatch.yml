name: Campaign dispatch

# Heartbeat for the email campaign sender. Vercel's Hobby plan only allows
# daily crons (vercel.json keeps one as a backstop), so the 10-minute cadence
# that scheduled campaigns and paced sends need lives here instead.
#
# SETUP (repository settings):
#   Variable  SITE_URL     https://visitdrakensberg.com   (no trailing slash)
#   Secret    CRON_SECRET  the same value as the app's CRON_SECRET env var
# Until both exist this workflow exits successfully without doing anything, so
# it is safe to merge before the provider is configured.
#
# GitHub only runs `schedule` triggers from the default branch, and may delay
# them by several minutes under load — fine for email pacing. Overlapping or
# duplicate runs are harmless: the sender claims recipients with
# FOR UPDATE SKIP LOCKED, so nobody is emailed twice.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: campaign-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the dispatcher
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL variable and CRON_SECRET secret are not both set — skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 120 \
            -X POST -H "Authorization: Bearer ${CRON_SECRET}" \
            "${SITE_URL%/}/api/cron/campaign-dispatch"
