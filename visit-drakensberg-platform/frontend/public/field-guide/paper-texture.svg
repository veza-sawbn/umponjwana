<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420">
  <!-- Tiling cartridge-paper grain. Deliberately low-contrast: it is the
       ground the whole field guide sits on, not a texture to be noticed. -->
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.09"/>
      </feComponentTransfer>
    </filter>
    <filter id="fibre" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.16" numOctaves="2" seed="19" result="f"/>
      <feColorMatrix in="f" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="420" height="420" fill="#F2EDE3"/>
  <rect width="420" height="420" filter="url(#fibre)" opacity="0.9"/>
  <rect width="420" height="420" filter="url(#grain)"/>
</svg>
